name: Validate compliance invariants
on:
  push:
    paths:
      - 'index.html'
      - 'app.html'
      - 'pro.html'
      - 'download.html'
      - 'guide.html'
      - 'partnership.html'
      - 'privacy.html'
      - 'terms.html'
      - 'health-data-privacy.html'
      - 'directory/**'
      - 'providers/**'
      - 'about/**'
      - 'tools/**'
      - 'markers/**'
      - 'compounds/**'
      - 'support.html'
      - 'scripts/validate-compliance.js'
      - '.github/workflows/validate-compliance.yml'
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Four regressions that are easy to make and expensive to find: a legal
      # link disappearing from a page that takes money, a verification or
      # product-testing claim we cannot substantiate, a placeholder listing
      # rendering on the public directory, and the privacy policy promising a
      # control the app does not implement. See docs/COMPLIANCE-AUDIT.md.
      - name: Legal links, substantiable claims, and the promised privacy switch
        run: node scripts/validate-compliance.js
      # Count claims and the retired-tier ban are guarded the same way, and were
      # running nowhere in CI. Every public page is in both lists, so they belong
      # in the same job.
      - name: No page over-claims a count or re-advertises a retired tier
        run: node scripts/validate-claims.js
