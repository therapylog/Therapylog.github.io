name: Validate sources
on:
  push:
    paths:
      - 'app.html'
      - 'assets/**'
      - 'scripts/**'
      - 'markers/**'
      - 'compounds/**'
      - 'sources/**'
      - '.github/workflows/validate-sources.yml'
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install --no-save acorn

      # The registry is derived from the <ol class="sources"> blocks in the
      # pages plus the authored manual.json. If a page adds or drops a citation
      # and nobody rebuilds, /sources/ quietly stops matching what the site
      # actually claims — which is worse than having no index page, because a
      # reader trusts it.
      - name: Source registry and /sources/ match the pages
        run: node scripts/build-sources.js --check

      # app.html is the source of truth for the brain; the index is a build
      # artifact. Without this the two drift and the app answers from stale
      # content while every test still passes.
      - name: Brain index matches app.html
        run: node scripts/build-brain.js --check

      # Routing behaviour, asserted both ways: entries that must be reachable
      # from the words people actually type, and questions that must NEVER be
      # answered from the library. The second half is the reason this runs in
      # CI rather than on request.
      #
      # Three separate content additions have each made a safety question
      # matchable by accident — a hot swollen calf reached an elbow rehab entry,
      # and a sixteen-year-old asking about a first cycle reached an
      # intermittent-fasting entry because the synonym '16:8' reduced to the
      # bare token "16". None of those were caught by any other check here,
      # because every other check passed while they were live.
      #
      # This also asserts the minor guard: a stated age under 18 next to a
      # compound question must return guard:'minor' and refuse, and five
      # adult phrasings containing a number must NOT trigger it.
      - name: Brain routes questions correctly, and refuses the ones it must
        run: node scripts/probe-brain.js
