name: Validate encyclopedia
on:
  push:
    paths: ['app.html', 'docs/compounds.json', 'docs/COMPOUNDS.md', 'index.html', 'marketing.html', 'scripts/**']
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/validate-encyclopedia.js
